name: Release integrity

on:
  push:
    branches: [main, production, "release/**"]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm run check:release
